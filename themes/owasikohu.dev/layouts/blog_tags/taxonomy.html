{{ define "main" }}
  <div class="blog-heading">
    <h1>タグ</h1>
    <nav class="blog-tools" aria-label="ブログメニュー">
      <a href="{{ "blog/" | relURL }}">記事一覧</a>
      <a href="{{ "blog/search/" | relURL }}">検索</a>
    </nav>
  </div>
  <ul class="tag-cloud">
    {{ range .Data.Terms.ByCount }}
      <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }} <span>{{ .Count }}</span></a></li>
    {{ else }}
      <li>タグはまだありません。</li>
    {{ end }}
  </ul>
{{ end }}
